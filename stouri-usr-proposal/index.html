:root{--ob:#0B0C0E;--an:#131518;--gr:#1B1E22;--si:#C9CDD2;--hi:#EEF0F2;--fog:#8FA3B3;--vi:#8E62F0;--li:#CDB8FF;--vd:#432596;--stone:#5B6168;
--pad:72px;--ease:cubic-bezier(.2,.7,.2,1);--line:rgba(201,205,210,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y proximity;background:var(--ob)}
body{background:var(--ob);color:var(--hi);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--vi);color:#fff}
.lab{font:600 11px/1.3 'Manrope';letter-spacing:.22em;text-transform:uppercase;color:var(--fog)}
.lab.li{color:var(--li)}
.serif{font-family:'Instrument Serif',serif;font-weight:400}
/* chrome */
#bar{position:fixed;inset:0 0 auto 0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);z-index:20;
background:linear-gradient(var(--ob) 30%,rgba(11,12,14,0))}
#bar .lk{height:20px;display:flex;cursor:pointer}#bar .lk svg{height:20px;width:auto}
#prog{position:fixed;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--vd),var(--vi),var(--li));z-index:21}
#dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:20}
#dots button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:12px;height:14px}
#dots i{width:6px;height:6px;border-radius:50%;background:rgba(201,205,210,.35);transition:all .35s var(--ease)}
#dots span{font:600 10px 'Manrope';letter-spacing:.2em;text-transform:uppercase;color:var(--si);opacity:0;transform:translateX(6px);transition:all .3s}
#dots button:hover span,#dots button:focus-visible span{opacity:1;transform:none}
#dots button.on i{background:var(--li);box-shadow:0 0 0 4px rgba(142,98,240,.25);height:18px;border-radius:3px}
/* sections */
.sec{position:relative;min-height:100vh;padding:104px var(--pad) 64px;scroll-snap-align:start;display:flex;flex-direction:column;overflow:hidden}
.sec .wrap{position:relative;width:100%;max-width:1296px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;z-index:2}
.quiet{background:radial-gradient(1200px 700px at 88% 0%,rgba(67,37,150,.32),rgba(11,12,14,0) 70%),var(--ob)}
.h2row{margin-bottom:36px}
h2{font:500 clamp(36px,4.2vw,56px)/1.02 'Manrope';letter-spacing:-.03em}
.num{font:600 11px 'Manrope';letter-spacing:.22em;color:var(--li)}
.rule{height:1px;background:var(--line)}
.acc{position:absolute;left:0;top:-1px;height:3px;width:48px;background:var(--vi);transition:width .6s var(--ease)}
.tile{position:relative;background:var(--an);border:1px solid rgba(201,205,210,.1);transition:transform .45s var(--ease),border-color .45s,background .45s}
.tile:hover{transform:translateY(-4px);border-color:rgba(205,184,255,.38);background:#16181c}
.tile:hover .acc{width:100%}
.lead{font-family:'Instrument Serif';font-size:clamp(28px,2.7vw,40px);line-height:1.18;color:var(--li);font-style:italic;max-width:1180px}
.big-lead{font:300 clamp(22px,2vw,28px)/1.35 'Manrope';max-width:1180px}
.sub{font:400 19px/1.5 'Manrope';color:var(--si);max-width:1100px;margin-top:22px}
.intent{margin-top:40px;font:400 italic clamp(26px,2.4vw,36px)/1.22 'Instrument Serif';color:var(--li)}
.kick{margin:40px 0 20px}
/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.sec.in .rv{opacity:1;transform:none}
/* rows */
.rows .row{display:grid;grid-template-columns:56px minmax(0,1fr);padding:22px 0;border-top:1px solid var(--line);position:relative;transition:padding .4s var(--ease),opacity .4s}
.rows .row:before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--li);transition:width .6s var(--ease)}
.rows .row:hover:before{width:100%}
.rows .row:hover{padding-left:8px}
.rows .row p{font:300 clamp(18px,1.55vw,21px)/1.4 'Manrope'}
.rows .row p em{font-style:normal;color:var(--li)}
/* cover */

function close() {

  return add("close", "Objective", "", `<canvas class="mer" data-geo="right"></canvas><div class="wrap">
  <div class="obj">${rv(`<p class="l1">${esc(l1)}</p>`, .15)}<p class="l2">${words}</p></div>
  <div class="close-foot rv" style="--d:1.6s">${D.wordmark_small}<a class="contact" href="mailto:${esc(S.contact)}">${esc(S.contact)}</a></div></div>`);
}

$("#home").innerHTML = D.lockup;

/* nav */
$("#dots").innerHTML = sections.map((s, i) => `<button data-i="${i}" aria-label="${esc(s.name)}"><span>${esc(s.name)}</span><i></i></button>`).join("");
const secEls = sections.map(s => document.getElementById(s.id));
let cur = 0;
function go(i) { i = Math.max(0, Math.min(secEls.length - 1, i)); secEls[i].scrollIntoView({behavior: "smooth"}); }
$$("#dots button").forEach(b => b.onclick = () => go(+b.dataset.i));
$("#home").onclick = () => go(0);
addEventListener("keydown", e => {
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === "Home") { e.preventDefault(); go(0); }
  if (e.key === "End") { e.preventDefault(); go(secEls.length - 1); }
});
function onScroll() {
  const h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  $("#prog").style.width = (p * 100).toFixed(2) + "%";
  const mid = innerHeight * .45;
  let idx = 0;
  secEls.forEach((el, i) => { if (el.getBoundingClientRect().top <= mid) idx = i; });
  if (idx !== cur || !$("#where").dataset.set) {
    cur = idx;
    $("#where").dataset.set = 1;
    $$("#dots button").forEach((b, i) => b.classList.toggle("on", i === cur));
    $("#where").textContent = cur === 0 ? "" : sections[cur].name;
  }
}
addEventListener("scroll", onScroll, {passive: true});

/* reveal + count-up */
function countUp(el) {
  const raw = el.dataset.count, m = raw.match(/^([^\d]*)([\d,]*\.?\d+)(.*)$/);
  if (!m || el.dataset.done) return;
  el.dataset.done = 1;
  const [, pre, num, suf] = m, comma = num.includes(","), dec = (num.split(".")[1] || "").length, target = parseFloat(num.replace(/,/g, ""));
  const t0 = performance.now(), dur = 1400;
  const fmt = v => { let s = v.toFixed(dec); if (comma) s = Number(s).toLocaleString("en-US", {minimumFractionDigits: dec, maximumFractionDigits: dec}); return pre + s + suf; };
  (function step(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(target * e); if (k < 1) requestAnimationFrame(step); else el.textContent = raw; })(t0);
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  setTimeout(() => $$("[data-count]", e.target).forEach(countUp), 250);
  if (e.target.id === "cover") lightUSR();
}), {threshold: .28});
secEls.forEach(el => io.observe(el));

/* USR pixel mark: lights left to right, glints under the pointer */
const rects = $$("#usr rect");
rects.forEach(r => { const x = +r.getAttribute("x"), y = +r.getAttribute("y"); r.style.transitionDelay = `${(.25 + x / 310 * .9 + y / 100 * .15).toFixed(3)}s`; });
function lightUSR() { setTimeout(() => rects.forEach(r => r.style.transitionDelay = "0s"), 1800); }
const usrBox = $("#usr");
usrBox.addEventListener("mousemove", e => {
  const b = usrBox.querySelector("svg").getBoundingClientRect(), sx = (e.clientX - b.left) / b.width * 310, sy = (e.clientY - b.top) / b.height * 100;
  rects.forEach(r => { const dx = +r.getAttribute("x") + 4.3 - sx, dy = +r.getAttribute("y") + 4.3 - sy; r.classList.toggle("hot", dx * dx + dy * dy < 260); });
});
usrBox.addEventListener("mouseleave", () => rects.forEach(r => r.classList.remove("hot")));
$("#cover").addEventListener("mousemove", e => {
  const k = (e.clientX / innerWidth - .5), j = (e.clientY / innerHeight - .5);
  usrBox.style.transform = `translate(${k * -14}px,${j * -10}px)`;
});

/* growth chart */
const G = S.goals, visible = G.lines.map(() => true), chart = $("#chart"), tip = $("#tip");
function layoutChart() {
  const tot = G.years.map((_, i) => G.lines.reduce((a, l, j) => a + (visible[j] ? l[1][i] : 0), 0));
  const peak = Math.max(1, ...tot), H = chart.clientHeight - 36;
  $$(".col", chart).forEach((c, i) => {
    $$(".seg", c).forEach(s => { const j = +s.dataset.j; s.style.height = (visible[j] ? G.lines[j][1][i] / peak * H : 0) + "px"; });
    $(".tot", c).textContent = money(tot[i]);
    c.style.setProperty("--band", (tot[i] / peak * H + 52) + "px");
  });
}
layoutChart();
addEventListener("resize", layoutChart);
$$(".legend button").forEach(b => b.onclick = () => {
  const j = +b.dataset.j;
  if (visible.filter(Boolean).length === 1 && visible[j]) return;
  visible[j] = !visible[j]; b.classList.toggle("off", !visible[j]); b.setAttribute("aria-pressed", visible[j]); layoutChart();
});
$$(".col", chart).forEach(c => {
  c.addEventListener("mouseenter", () => {
    const i = +c.dataset.i;
    tip.innerHTML = `<div class="lab li" style="margin-bottom:8px">${G.years[i]}</div>` + G.lines.map(([n, v], j) => v[i] ? `<div class="r"><span><i style="background:${COLORS[j]}"></i>${esc(n)}</span><b>$${v[i].toLocaleString("en-US")}K</b></div>` : "").join("") +
      `<div class="r" style="border-top:1px solid rgba(201,205,210,.2);margin-top:6px;padding-top:4px"><span>Total ARR</span><b>${money(G.totals[i])}</b></div>`;
    const cb = c.getBoundingClientRect(), pb = chart.getBoundingClientRect();
    let x = cb.left - pb.left + cb.width / 2 - 120; x = Math.max(0, Math.min(pb.width - 240, x));
    tip.style.left = x + "px"; tip.style.top = "-20px"; tip.classList.add("on");
  });
  c.addEventListener("mouseleave", () => tip.classList.remove("on"));
});
function highlight(j) { chart.classList.toggle("hl", j !== null); $$(".seg", chart).forEach(s => s.classList.toggle("on", +s.dataset.j === j)); }
$$(".gt").forEach(t => { t.addEventListener("mouseenter", () => highlight(+t.dataset.j)); t.addEventListener("mouseleave", () => highlight(null)); });
$$(".legend button").forEach(b => { b.addEventListener("mouseenter", () => visible[+b.dataset.j] && highlight(+b.dataset.j)); b.addEventListener("mouseleave", () => highlight(null)); });

/* toggles: ledger lines, quarters, decision items (accent bar fills as items are agreed) */
const toggle = el => { el.classList.toggle(el.classList.contains("nt") ? "ok" : "on"); el.setAttribute("aria-pressed", el.matches(".ok,.on")); };
$$(".li-row").forEach(r => r.addEventListener("click", () => toggle(r)));
const share = $("#share");
function shareHl(j) { share.classList.toggle("hl", j !== null); $$("i", share).forEach(s => s.classList.toggle("on", +s.dataset.j === j)); }
$$(".li-row").forEach(r => { r.addEventListener("mouseenter", () => shareHl(+r.dataset.j)); r.addEventListener("mouseleave", () => shareHl(null)); });
$$(".qh").forEach(h => h.addEventListener("click", () => { const g = h.closest(".qg"); $$(".qg").forEach(x => x.classList.toggle("on", x === g)); }));
$$(".opt").forEach(o => o.addEventListener("click", () => {
  const was = o.classList.contains("sel");
  $$(".opt").forEach(x => { x.classList.toggle("sel", x === o && !was); x.setAttribute("aria-pressed", x.classList.contains("sel")); });
}));
const nts = $$(".nt"), nextAcc = $("#nextacc");
nts.forEach(n => n.addEventListener("click", () => {
  toggle(n);
  const k = nts.filter(x => x.classList.contains("ok")).length / nts.length;
  nextAcc.style.width = `calc(48px + (100% - 48px) * ${k.toFixed(3)})`;
}));

/* meridian light arcs (slow drift) */
const mers = $$("canvas.mer").map(cv => ({cv, ctx: cv.getContext("2d"), on: false}));
const mio = new IntersectionObserver(es => es.forEach(e => { const m = mers.find(m => m.cv === e.target); if (m) m.on = e.isIntersecting; }), {threshold: 0});
mers.forEach(m => mio.observe(m.cv));
function drawMer(m, t) {
  const {cv, ctx} = m, dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  let cx = w * .74, cy = h * .42;
  if (cv.dataset.geo === "usr") { const b = usrBox.getBoundingClientRect(), pb = cv.getBoundingClientRect(); cx = b.left - pb.left + b.width / 2; cy = b.top - pb.top + b.height / 2; }
  const R = Math.max(w, h) * .4, k = R / 576, n = 14;
  ctx.translate(cx, cy); ctx.rotate(-17 * Math.PI / 180);
  const g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, "rgba(142,98,240,0)"); g.addColorStop(.32, "rgba(142,98,240,.5)"); g.addColorStop(.5, "rgba(255,255,255,1)"); g.addColorStop(.68, "rgba(205,184,255,.5)"); g.addColorStop(1, "rgba(142,98,240,0)");
  ctx.strokeStyle = g;
  for (let i = 0; i < n; i++) {
    const ph = i * 2 * Math.PI / n + t, s = Math.sin(ph), c = Math.cos(ph);
    if (c < .03) continue;
    const rx = Math.max(.5, Math.abs(R * s));
    for (const [lw, a] of [[8 * k, c * c * .1], [1.1 * k, c * c * .5]]) {
      ctx.globalAlpha = a; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(0, 0, rx, R, 0, -Math.PI / 2, Math.PI / 2, s < 0); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let T = .42;
(function loop() { if (!still) T += .0009; mers.forEach(m => m.on && drawMer(m, T)); requestAnimationFrame(loop); })();
mers.forEach(m => drawMer(m, T));

window.PROP = {go, sections: () => sections.map(s => s.id), reveal: () => secEls.forEach(el => { el.classList.add("in"); $$("[data-count]", el).forEach(countUp); })};
onScroll();
Promise.all(["Manrope", "Instrument Serif"].map(f => document.fonts.load(`400 20px "${f}"`))).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
